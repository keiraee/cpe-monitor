<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPE Monitor - 设备监控面板</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #3b82f6;
      --accent-light: #60a5fa;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1::before {
      content: "📡";
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    .status-dot.error {
      background: var(--danger);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .refresh-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background: var(--accent-light);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .interval-select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .card-title {
      font-size: 14px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-dim);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .progress-fill.normal {
      background: var(--success);
    }

    .progress-fill.warning {
      background: var(--warning);
    }

    .progress-fill.danger {
      background: var(--danger);
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      background: var(--bg);
      color: var(--text-dim);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .signal-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .signal-strong {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
    }

    .signal-medium {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .signal-weak {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
    }

    .last-update {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 16px;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .stat-value {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>CPE Monitor</h1>
    <div class="controls">
      <span class="status-dot" id="statusDot"></span>
      <select class="interval-select" id="intervalSelect">
        <option value="1">1秒</option>
        <option value="3">3秒</option>
        <option value="5" selected>5秒</option>
        <option value="10">10秒</option>
        <option value="30">30秒</option>
      </select>
      <button class="refresh-btn" id="refreshBtn" onclick="App.refresh()">刷新</button>
    </div>
  </div>

  <div class="grid">
    <!-- 运行时间 -->
    <div class="card">
      <div class="card-title">⏱️ 运行时间</div>
      <div class="stat-value" id="uptime">--</div>
      <div class="stat-label">设备已运行</div>
    </div>

    <!-- CPU 负载 -->
    <div class="card">
      <div class="card-title">📊 CPU 负载</div>
      <div class="stat-value" id="load1m">--</div>
      <div class="stat-label">
        <span>1分钟: <span id="load1mLabel">--</span></span> · 
        <span>5分钟: <span id="load5mLabel">--</span></span> · 
        <span>15分钟: <span id="load15mLabel">--</span></span>
      </div>
    </div>

    <!-- 内存 -->
    <div class="card">
      <div class="card-title">💾 内存</div>
      <div class="stat-value" id="memPercent">--</div>
      <div class="stat-label" id="memLabel">-- / --</div>
      <div class="progress-bar">
        <div class="progress-fill" id="memBar" style="width: 0%"></div>
      </div>
    </div>

    <!-- 存储 -->
    <div class="card">
      <div class="card-title">💿 存储</div>
      <div class="stat-value" id="storPercent">--</div>
      <div class="stat-label" id="storLabel">-- / --</div>
      <div class="progress-bar">
        <div class="progress-fill" id="storBar" style="width: 0%"></div>
      </div>
    </div>

    <!-- 连接数 -->
    <div class="card">
      <div class="card-title">🔗 网络连接</div>
      <div class="stat-value" id="conntrack">--</div>
      <div class="stat-label" id="conntrackLabel">最大: --</div>
      <div class="progress-bar">
        <div class="progress-fill" id="conntrackBar" style="width: 0%"></div>
      </div>
    </div>

    <!-- WiFi 网络 -->
    <div class="card">
      <div class="card-title">📶 WiFi 网络</div>
      <div id="wifiInfo">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>

  <!-- DHCP 租约 -->
  <div class="card" style="margin-bottom: 24px;">
    <div class="card-title">📋 DHCP 租约 (<span id="leaseCount">0</span> 台设备)</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>设备名称</th>
            <th>IP 地址</th>
            <th>MAC 地址</th>
          </tr>
        </thead>
        <tbody id="leasesBody">
          <tr><td colspan="3" class="empty-state">暂无设备</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- WiFi 客户端 -->
  <div class="card">
    <div class="card-title">📱 WiFi 客户端 (<span id="clientCount">0</span> 台)</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>MAC 地址</th>
            <th>网络</th>
            <th>信号强度</th>
            <th>接收速率</th>
            <th>发送速率</th>
          </tr>
        </thead>
        <tbody id="clientsBody">
          <tr><td colspan="5" class="empty-state">暂无客户端</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="last-update">
    最后更新: <span id="lastUpdate">--</span>
  </div>

  <script>
    // ========== 配置管理 ==========
    const ConfigManager = {
      interval: 5,
      
      init() {
        const select = document.getElementById('intervalSelect');
        select.addEventListener('change', (e) => {
          this.interval = parseInt(e.target.value);
          DataManager.restartPolling();
        });
      }
    };

    // ========== 数据管理 ==========
    const DataManager = {
      data: null,
      timer: null,
      loading: false,
      
      async fetch() {
        if (this.loading) return;
        this.loading = true;
        
        try {
          const response = await fetch('/cgi-bin/monitor');
          if (!response.ok) throw new Error('HTTP ' + response.status);
          this.data = await response.json();
          UIManager.update(this.data);
          this.setStatus(true);
        } catch (error) {
          console.error('Fetch error:', error);
          this.setStatus(false);
        } finally {
          this.loading = false;
        }
      },
      
      setStatus(ok) {
        const dot = document.getElementById('statusDot');
        dot.classList.toggle('error', !ok);
      },
      
      startPolling() {
        this.fetch();
        this.timer = setInterval(() => this.fetch(), ConfigManager.interval * 1000);
      },
      
      stopPolling() {
        if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
        }
      },
      
      restartPolling() {
        this.stopPolling();
        this.startPolling();
      }
    };

    // ========== UI 管理 ==========
    const UIManager = {
      update(data) {
        this.updateUptime(data.uptime);
        this.updateLoad(data.load);
        this.updateMemory(data.mem);
        this.updateStorage(data.storage);
        this.updateConntrack(data.conntrack);
        this.updateWifiInfo(data.wifi_info);
        this.updateLeases(data.leases);
        this.updateClients(data.wifi_clients);
        this.updateLastUpdate();
      },
      
      updateUptime(seconds) {
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        
        let text = '';
        if (days > 0) text += days + '天 ';
        if (hours > 0) text += hours + '小时 ';
        text += mins + '分钟';
        
        document.getElementById('uptime').textContent = text;
      },
      
      updateLoad(load) {
        const val = parseFloat(load['1m']);
        document.getElementById('load1m').textContent = val.toFixed(2);
        document.getElementById('load1mLabel').textContent = load['1m'];
        document.getElementById('load5mLabel').textContent = load['5m'];
        document.getElementById('load15mLabel').textContent = load['15m'];
      },
      
      updateMemory(mem) {
        const percent = Math.round((mem.used / mem.total) * 100);
        document.getElementById('memPercent').textContent = percent + '%';
        document.getElementById('memLabel').textContent = 
          this.formatKB(mem.used) + ' / ' + this.formatKB(mem.total);
        
        const bar = document.getElementById('memBar');
        bar.style.width = percent + '%';
        bar.className = 'progress-fill ' + this.getBarClass(percent);
      },
      
      updateStorage(stor) {
        const total = stor.used + stor.available;
        const percent = Math.round((stor.used / total) * 100);
        document.getElementById('storPercent').textContent = percent + '%';
        document.getElementById('storLabel').textContent = 
          this.formatKB(stor.used) + ' / ' + this.formatKB(total);
        
        const bar = document.getElementById('storBar');
        bar.style.width = percent + '%';
        bar.className = 'progress-fill ' + this.getBarClass(percent);
      },
      
      updateConntrack(ct) {
        document.getElementById('conntrack').textContent = ct.count;
        document.getElementById('conntrackLabel').textContent = '最大: ' + ct.max;
        
        const percent = Math.round((ct.count / ct.max) * 100);
        const bar = document.getElementById('conntrackBar');
        bar.style.width = percent + '%';
        bar.className = 'progress-fill ' + this.getBarClass(percent);
      },
      
      updateWifiInfo(infos) {
        const container = document.getElementById('wifiInfo');
        if (!infos || infos.length === 0) {
          container.innerHTML = '<div class="empty-state">暂无WiFi信息</div>';
          return;
        }
        
        container.innerHTML = infos.map(info => `
          <div class="stat-row">
            <span>${info.essid} (${info.iface})</span>
            <span style="color: var(--text-dim)">CH ${info.channel}</span>
          </div>
        `).join('');
      },
      
      updateLeases(leases) {
        document.getElementById('leaseCount').textContent = leases.length;
        const tbody = document.getElementById('leasesBody');
        
        if (leases.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="empty-state">暂无设备</td></tr>';
          return;
        }
        
        tbody.innerHTML = leases.map(lease => `
          <tr>
            <td>${lease.hostname}</td>
            <td><code>${lease.ip}</code></td>
            <td><code>${lease.mac}</code></td>
          </tr>
        `).join('');
      },
      
      updateClients(clients) {
        document.getElementById('clientCount').textContent = clients.length;
        const tbody = document.getElementById('clientsBody');
        
        if (clients.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无客户端</td></tr>';
          return;
        }
        
        tbody.innerHTML = clients.map(client => {
          const signal = parseInt(client.signal);
          let signalClass = 'signal-strong';
          let signalText = '强';
          
          if (isNaN(signal)) {
            signalClass = '';
            signalText = 'N/A';
          } else if (signal < -70) {
            signalClass = 'signal-weak';
            signalText = '弱';
          } else if (signal < -50) {
            signalClass = 'signal-medium';
            signalText = '中';
          }
          
          return `
            <tr>
              <td><code>${client.mac}</code></td>
              <td>${client.iface}</td>
              <td><span class="signal-badge ${signalClass}">${client.signal} dBm (${signalText})</span></td>
              <td>${client.rx_rate} Mbps</td>
              <td>${client.tx_rate} Mbps</td>
            </tr>
          `;
        }).join('');
      },
      
      updateLastUpdate() {
        const now = new Date();
        document.getElementById('lastUpdate').textContent = 
          now.toLocaleTimeString('zh-CN', { hour12: false });
      },
      
      formatKB(kb) {
        if (kb >= 1048576) return (kb / 1048576).toFixed(1) + ' GB';
        if (kb >= 1024) return (kb / 1024).toFixed(0) + ' MB';
        return kb + ' KB';
      },
      
      getBarClass(percent) {
        if (percent >= 90) return 'danger';
        if (percent >= 70) return 'warning';
        return 'normal';
      }
    };

    // ========== 应用主控制器 ==========
    const App = {
      init() {
        ConfigManager.init();
        DataManager.startPolling();
        
        // 页面不可见时暂停刷新
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            DataManager.stopPolling();
          } else {
            DataManager.startPolling();
          }
        });
      },
      
      refresh() {
        DataManager.fetch();
      }
    };

    // 启动
    App.init();
  </script>
</body>
</html>
